; Pool sizing + safety rails.  Mount LAST in php-fpm.d/ so it wins (zz- prefix).
; SIZE IT:  pm.max_children ~= (container_limit - overhead) / peak_worker_RSS
;           measure peak with:  ps -o rss= -C php-fpm | sort -rn | head -1
;           WordPress + Elementor peaks ~180-200 MB/worker, so 512M => 3, NOT the
;           image default of 5.  Oversizing does not degrade, it OOM-loops.
[www]
pm = dynamic
pm.max_children = __MAX_CHILDREN__
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle workers: caps memory-leak growth over time.
pm.max_requests = 200

; A wedged worker must release its slot. Without this one request was observed
; holding a slot for 6,705 seconds while the pool starved.
; The proxy's read timeout must be set ABOVE this value.
request_terminate_timeout = 60s

; Turns "the site is slow" into an actual stack trace.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Watchdog inputs. Expose these ONLY to private client IPs at the proxy.
; Caddy needs: env SCRIPT_NAME {http.request.uri.path} (see gotchas.md)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

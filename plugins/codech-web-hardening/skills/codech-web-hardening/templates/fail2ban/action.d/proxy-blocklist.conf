# Ban at the REVERSE PROXY rather than the firewall.
# Why: behind a CDN the firewall only ever sees CDN edge IPs, so a firewall ban
# either does nothing or blocks a whole PoP. The proxy knows the real client IP
# and reloads gracefully (no dropped connections).
[Definition]
actionstart  = __BLOCKLIST_SH__ rebuild
actionstop   =
actioncheck  =
actionban    = __BLOCKLIST_SH__ ban <ip>
actionunban  = __BLOCKLIST_SH__ unban <ip>
actionflush  = : > __BLOCKLIST_TXT__ && __BLOCKLIST_SH__ rebuild

[Init]

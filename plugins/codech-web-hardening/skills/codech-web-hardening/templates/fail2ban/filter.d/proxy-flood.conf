# Flood detection from a JSON reverse-proxy access log.
# Counts only DYNAMIC requests: one normal page load pulls 60+ static assets and
# would otherwise look like a flood.
# Requires the proxy to log the REAL client IP (trusted_proxies + CDN header).
[Definition]
_static = (?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|map|mp4|webm|mp3|pdf|txt|xml|json|zip)
failregex = ^.*"client_ip":"<HOST>",.*"uri":"(?!__STATIC_PATH_PREFIXES__)(?![^"?]*\.%(_static)s(?:\?|"))[^"]*".*$
ignoreregex =
